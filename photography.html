<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jake Reitman, Nassau Candy</title>
    <meta name="description" content="Travel photography by Jake Reitman — Australia & New Zealand, India, and South Africa.">
    <meta property="og:title" content="Jake Reitman, Nassau Candy">
    <meta property="og:description" content="Travel photography by Jake Reitman.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jakereitman.com/photography.html">
    <meta property="og:image" content="https://jakereitman.com/images/web/profile.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
</head>
<body class="photo-page">

    <nav class="candy-nav">
        <a href="index.html" class="nav-logo">🍬 <span>Jake Reitman</span></a>
        <div class="nav-links">
            <a href="index.html">Start</a>
            <a href="index.html#career">Career Path</a>
            <a href="photography.html" class="active">Photography</a>
            <a href="index.html#finish">Contact</a>
        </div>
    </nav>

    <header class="photo-hero">
        <span class="section-emoji">📸</span>
        <h1>Photography</h1>
        <div class="photo-jump">
            <a href="#australia" class="candy-chip" style="--chip-color: var(--sky);">Australia &amp; NZ</a>
            <a href="#india" class="candy-chip" style="--chip-color: var(--lemon);">India</a>
            <a href="#southafrica" class="candy-chip" style="--chip-color: var(--cherry);">South Africa</a>
        </div>
    </header>

    <main class="photo-main">

        <section class="photo-gallery" id="australia">
            <h2><span style="--underline: var(--sky);">Australia &amp; New Zealand</span></h2>
            <div class="photo-grid">
                <button class="photo-item" data-full="images/web/1.jpg"><img src="images/thumbs/1.jpg" alt="Australia & New Zealand photo 1" loading="lazy"></button>
                <button class="photo-item" data-full="images/web/2.jpg"><img src="images/thumbs/2.jpg" alt="Australia & New Zealand photo 2" loading="lazy"></button>
                <button class="photo-item" data-full="images/web/3.jpg"><img src="images/thumbs/3.jpg" alt="Australia & New Zealand photo 3" loading="lazy"></button>
            </div>
        </section>

        <section class="photo-gallery" id="india">
            <h2><span style="--underline: var(--lemon);">India</span></h2>
            <div class="photo-grid">
                <button class="photo-item" data-full="images/web/4.jpg"><img src="images/thumbs/4.jpg" alt="India photo 1" loading="lazy"></button>
                <button class="photo-item" data-full="images/web/5.jpg"><img src="images/thumbs/5.jpg" alt="India photo 2" loading="lazy"></button>
                <button class="photo-item" data-full="images/web/6.jpg"><img src="images/thumbs/6.jpg" alt="India photo 3" loading="lazy"></button>
            </div>
        </section>

        <section class="photo-gallery" id="southafrica">
            <h2><span style="--underline: var(--cherry);">South Africa</span></h2>
            <div class="photo-grid">
                <button class="photo-item" data-full="images/web/7.jpg"><img src="images/thumbs/7.jpg" alt="South Africa photo 1" loading="lazy"></button>
                <button class="photo-item" data-full="images/web/8.jpg"><img src="images/thumbs/8.jpg" alt="South Africa photo 2" loading="lazy"></button>
                <button class="photo-item" data-full="images/web/9.jpg"><img src="images/thumbs/9.jpg" alt="South Africa photo 3" loading="lazy"></button>
            </div>
        </section>

        <div class="more-soon">🍬 More expeditions coming soon…</div>
    </main>

    <div class="lightbox" id="lightbox" hidden>
        <button class="lightbox-close" aria-label="Close">✕</button>
        <img src="" alt="Full size photo" id="lightbox-img">
    </div>

    <footer class="candy-footer">
        <p>© 2026 Jake Reitman</p>
    </footer>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        document.querySelectorAll('.photo-item').forEach(item => {
            item.addEventListener('click', () => {
                lightboxImg.src = item.dataset.full;
                lightbox.hidden = false;
                document.body.style.overflow = 'hidden';
            });
        });
        function closeLightbox() {
            lightbox.hidden = true;
            lightboxImg.src = '';
            document.body.style.overflow = '';
        }
        lightbox.addEventListener('click', closeLightbox);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
    </script>
</body>
</html>
